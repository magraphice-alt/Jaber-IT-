<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />
  
  <!-- Icon Logo: Mobile / Signal / Telecom & Shield -->
  <circle cx="256" cy="180" r="70" fill="url(#accentGrad)" opacity="0.9" />
  <path d="M226 150 L286 180 L226 210 Z" fill="#ffffff" />
  
  <!-- Text Masud Telecom -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MASUD</text>
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">TELECOM</text>
  
  <!-- Signal wave dots -->
  <circle cx="170" cy="425" r="8" fill="#38bdf8" />
  <circle cx="210" cy="425" r="10" fill="#38bdf8" />
  <circle cx="256" cy="425" r="12" fill="#22c55e" />
  <circle cx="302" cy="425" r="10" fill="#38bdf8" />
  <circle cx="342" cy="425" r="8" fill="#38bdf8" />
</svg>
